#       - "packages/${vars.lang}_${vars.model}_${vars.package_name}-${vars.package_version}/dist/${vars.lang}_${vars.model}_${vars.package_name}-${vars.package_version}.tar.gz"

  - name: clean
    help: "Remove intermediate files"
    script:
      - "rm -rf training/*"
      - "rm -rf metrics/*"
      - "rm -rf corpus/*"