# This workflow will
# 1) Update the version number in pyproject.toml based on the commit history
# 2) Create a git tag
# 3) Create a release on GitHub
# 4) Upload the package to PyPI

name: Release
on:
  workflow_run:
    workflows: ["test"]
    branches: [main]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      # Mandatory for trusted publishing to PyPI. A guide on how to set it up:
      # https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/
      id-token: write
      contents: write

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Checkout action is required for token to persist
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Leaves the working tree untouched, so PSR finds nothing to commit and
          # tags HEAD instead of pushing a release commit to the protected `main`.
          # Release notes are still generated for the GitHub Release.
          changelog: false
      
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
        # This action supports PyPI's trusted publishing implementation, which allows authentication to PyPI without a manually 
        # configured API token or username/password combination. To perform trusted publishing with this action, your project's 
        # publisher must already be configured on PyPI.
      
      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/publish-action@v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
