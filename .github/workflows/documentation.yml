# builds the documentation and pushes it to the gh-pages branch
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The trf pipelines used by the tutorials include a coreference component
      # that requires the `coref` extra, which is only installable on Python
      # <3.12. See docs/installation.md.
      - name: Install Python
        run: uv python install 3.11

      - name: Build docs
        run: make build-docs

      - name: Deploy to gh-pages
        if: ${{ github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
