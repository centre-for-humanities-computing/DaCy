[build-system]
requires = ["setuptools>=64.0.0", "setuptools-scm>=8.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dacy"
# Derived from the latest git tag by setuptools-scm
dynamic = ["version"]
description = "A Danish State-of-the-Art SpaCy pipeline for dependency parsing, named entity recognition, parts-of-speech tagging and more."
authors = [
  { name = "Kenneth Enevoldsen", email = "dacy.plasma625@passfwd.com" },
  { name = "Lasse Hansen" },
  { name = "Emil Jessen" },
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

keywords = ["nlp", "danish", "spacy-universe"]
requires-python = ">=3.10"
dependencies = [
  "spacy-wrap>=1.4.1",
  "spacy[transformers]>=3.2.0",
  "pandas>=1.0.0",
  "tqdm>=4.42.1",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
# Required to load DaCy's trf models (small/medium/large), which include a
# coreference resolution component. Only available for Python <3.12, as
# spacy-experimental has no wheels for newer Python versions.
coref = [
  "spacy-experimental>=0.6.2,<0.7.0; python_version<'3.12'",
  # thinc <8.3 (pulled in by spacy <3.8) is not numpy 2.x compatible
  "numpy<2; python_version<'3.12'",
]


[project.urls]
homepage = "https://centre-for-humanities-computing.github.io/DaCy/"
documentation = "https://centre-for-humanities-computing.github.io/DaCy/"
repository = "https://github.com/centre-for-humanities-computing/DaCy"
[dependency-groups]
dev = [
    "ty>=0.0.46",
    "ruff==0.7.1",
]
tests = ["pytest>=7.1.2", "pytest-cov>=3.0.0", "pytest-instafail>=0.4.2"]
docs = [
  "sphinx==5.3.0",
  "furo>=2022.12.7",             # theme
  "sphinx-copybutton>=0.5.1",
  "sphinxext-opengraph>=0.7.3",
  "sphinx_design>=0.3.0",
  "sphinx_togglebutton>=0.2.3",
  "myst-nb>=0.6.0",              # for rendering notebooks
  "sphinxcontrib-bibtex>=2.0.0",
  # required for building the docs with references
  # potentially see https://sourceforge.net/p/docutils/patches/195/
  # and related issues
  # not possible to upgrade to >0.20.0 as sphinx <7 is required
  # for most of the extensions and it is not compatible with
  # docutils >0.20.0
  "docutils==0.17.1",
  # for tutorials
  "jupyter>=1.0.0",
  # spacy <3.8 (pulled in by the `coref` extra, which the tutorials need)
  # imports `display` from `IPython.core.display`, which IPython 9 removed.
  "ipython<9",
  "wikidata>=0.7.0",
  # sentiment analysis
  "asent>=0.4.2",
  "augmenty>=1.0.2",
  # for the textdescriptives tutorial
  "textdescriptives>=2.1.0",
  "seaborn>=0.11.2",
  # for performance notebooks
  "altair>=4.1.0",
  "datasets>=1.14.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points.spacy_factories]
"dacy/emotion" = "dacy.sentiment.wrapped_models:make_emotion_transformer"
"dacy/hatespeech_classification" = "dacy.hate_speech.wrapped_models:make_offensive_transformer"
"dacy/ner" = "dacy.ner.wrapped_models"
"dacy/ner-fine-grained" = "dacy.ner.fine_grained"

[tool.setuptools.package-data]
"*" = ["*.csv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["**/tests/*", "**/about.py", "**/dev/*"]

[tool.pyright]
exclude = [".*venv*"]
pythonPlatform = "Darwin"

[tool.ruff]
# extend-include = ["*.ipynb"]

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "__init__.py",
  ".env",
  "__pycache__",
  "dev/**",
  "training/main/**",
  "training/ner_fine_grained/**",
  "papers/DaCy-A-Unified-Framework-for-Danish-NLP/**",
  "docs/performance_testing_utils/**",
]
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "COM",
  "D417",
  "E",
  "ERA",
  "F",
  "I",
  "ICN",
  "NPY001",
  "PD002",
  "PIE",
  "PLE",
  "PLW",
  "PT",
  "UP",
  "Q",
  "PTH",
  "RSE",
  "RET",
  "RUF",
  "SIM",
  "W",
]
ignore = ["ANN401", "E402", "E501", "F841", "RET504", "ANN202", "COM812"]
# Allow autofix for all enabled rules (when `--fix`) is provided.
unfixable = ["ERA"]


# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true


[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.semantic_release]
# PSR builds *before* it creates the tag, so setuptools-scm cannot see the new
# version in the git history yet. PSR injects NEW_VERSION into the build
# environment; hand it to setuptools-scm so the artifacts are stamped correctly.
build_command = "python -m pip install build && SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DACY=$NEW_VERSION python -m build"

# `branch = "main"` was v7 syntax and is silently ignored from v8 onwards.
[tool.semantic_release.branches.main]
match = "main"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
# `v2.8.0` -> `2.8.0`, matching the tags semantic-release already creates.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# PyPI rejects local version segments (`+g1a2b3c4`), which the default scheme
# adds for any commit that is not exactly on a tag.
local_scheme = "no-local-version"

[tool.uv]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
